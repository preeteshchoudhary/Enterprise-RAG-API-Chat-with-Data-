[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-system"
version = "1.0.0"
description = "Enterprise-Grade RAG System with Hybrid Search, Cohere Reranking, Observability, and Ragas Evaluation"
authors = [{ name = "Principal AI Infrastructure Engineer" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "openai>=1.12.0",
    "cohere>=5.0.0",
    "qdrant-client>=1.7.3",
    "rank-bm25>=0.2.2",
    "pypdf>=4.0.1",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "streamlit>=1.31.0",
    "ragas>=0.1.2",
    "langchain>=0.1.6",
    "langchain-community>=0.0.19",
    "langsmith>=0.1.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.2.1",
    "mypy>=1.8.0",
    "black>=24.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
